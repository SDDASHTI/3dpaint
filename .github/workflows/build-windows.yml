
name: Build ArmorPaint Windows Latest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ArmorPaint Windows x64
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      # 1. Download latest source
      - name: Checkout ArmorPaint
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          ref: main
          fetch-depth: 1

      # 2. Setup Visual Studio compiler
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 3. Install LLVM
      - name: Install LLVM
        shell: pwsh
        run: |
          winget install --id LLVM.LLVM --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          $llvm = "C:\Program Files\LLVM\bin"

          if (!(Test-Path "$llvm\clang-cl.exe")) {
            throw "clang-cl was not installed."
          }

          Add-Content $env:GITHUB_PATH $llvm

      # 4. Verify compiler
      - name: Verify Build Tools
        shell: pwsh
        run: |
          cl
          clang-cl --version

      # 5. Build ArmorPaint using official build system
      - name: Compile ArmorPaint
        shell: pwsh
        working-directory: paint
        run: |
          Write-Host "Building ArmorPaint from main..."
          Write-Host "Using base/make --compile"

          ..\base\make --compile

          if ($LASTEXITCODE -ne 0) {
            throw "ArmorPaint compilation failed."
          }

          Write-Host "Build command completed."

      # 6. Locate executable
      - name: Locate Build Output
        shell: pwsh
        run: |
          Write-Host "Searching for ArmorPaint.exe..."

          $exe = Get-ChildItem paint -Filter ArmorPaint.exe -Recurse |
            Where-Object {
              $_.FullName -match '\\Release\\'
            } |
            Select-Object -First 1

          if (!$exe) {
            $exe = Get-ChildItem paint -Filter ArmorPaint.exe -Recurse |
              Select-Object -First 1
          }

          if (!$exe) {
            Write-Host "Files found in build directory:"
            Get-ChildItem paint\build -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

            throw "ArmorPaint.exe was not generated."
          }

          Write-Host "Found executable:"
          Write-Host $exe.FullName

          "EXE_PATH=$($exe.FullName)" |
            Out-File $env:GITHUB_ENV -Append

      # 7. Package executable and data
      - name: Package ArmorPaint
        shell: pwsh
        run: |
          $exe = $env:EXE_PATH

          $data = "paint\build\out\data"

          if (!(Test-Path $data)) {
            Write-Host "Searching for data directory..."

            $found = Get-ChildItem paint\build `
              -Directory -Filter data -Recurse |
              Select-Object -First 1

            if (!$found) {
              throw "ArmorPaint data directory was not found."
            }

            $data = $found.FullName
          }

          Write-Host "Executable: $exe"
          Write-Host "Data: $data"

          New-Item -ItemType Directory `
            -Force package | Out-Null

          Copy-Item $exe package\ArmorPaint.exe
          Copy-Item $data package\data -Recurse

          Compress-Archive `
            -Path package\* `
            -DestinationPath ArmorPaint-Windows-x64.zip `
            -CompressionLevel Optimal

          if (!(Test-Path ArmorPaint-Windows-x64.zip)) {
            throw "ZIP creation failed."
          }

      # 8. Upload final artifact
      - name: Upload ArmorPaint
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: ArmorPaint-Windows-x64.zip
          retention-days: 30
          if-no-files-found: error
