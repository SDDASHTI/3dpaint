name: Build ArmorPaint

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build and graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            lld \
            libvulkan-dev \
            vulkan-tools \
            mesa-vulkan-drivers \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            libasound2-dev

      - name: Generate project and build with base/make
        working-directory: paint
        run: |
          ../base/make

      - name: Package build output
        run: |
          tar -czvf armorpaint-linux-x64.tar.gz paint/build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: armorpaint-linux-x64
          path: armorpaint-linux-x64.tar.gz
          if-no-files-found: error
