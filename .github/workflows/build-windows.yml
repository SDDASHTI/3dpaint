
name: Build ArmorPaint Windows Latest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout latest ArmorPaint
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          ref: main
          fetch-depth: 1

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM
        shell: pwsh
        run: |
          winget install --id LLVM.LLVM --exact `
            --silent --accept-package-agreements `
            --accept-source-agreements

          Add-Content $env:GITHUB_PATH `
            "C:\Program Files\LLVM\bin"

      - name: Verify compiler
        shell: pwsh
        run: |
          clang-cl --version
          cl

      - name: Build ArmorPaint
        shell: pwsh
        working-directory: paint
        run: |
          ..\base\make --compile

      - name: Locate build output
        shell: pwsh
        run: |
          Write-Host "Searching for ArmorPaint.exe..."

          Get-ChildItem paint -Filter ArmorPaint.exe -Recurse |
            ForEach-Object {
              Write-Host $_.FullName
            }

          $exe = Get-ChildItem paint -Filter ArmorPaint.exe -Recurse |
            Select-Object -First 1

          if (-not $exe) {
            throw "ArmorPaint.exe was not generated."
          }

          $out = $exe.Directory.FullName
          $data = Join-Path $out "data"

          if (-not (Test-Path $data)) {
            throw "Data folder not found: $data"
          }

          New-Item -ItemType Directory -Force package | Out-Null

          Copy-Item $exe.FullName package\ArmorPaint.exe
          Copy-Item $data package\data -Recurse

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path package\* `
            -DestinationPath ArmorPaint-Windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: ArmorPaint-Windows-x64.zip
          retention-days: 30
