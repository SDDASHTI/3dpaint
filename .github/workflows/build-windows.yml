name: Build ArmorPaint Windows (x64)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure Visual Studio Clang tools are installed
        shell: pwsh
        run: |
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Start-Process -FilePath $vsInstaller -ArgumentList `
            "modify", "--installPath", "`"$vsPath`"", `
            "--add", "Microsoft.VisualStudio.Component.VC.Llvm.Clang", `
            "--add", "Microsoft.VisualStudio.Component.VC.Llvm.ClangToolset", `
            "--quiet", "--norestart" -Wait

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate Visual Studio Solution
        working-directory: paint
        shell: cmd
        run: ..\base\make

      - name: Compile ArmorPaint (Release x64)
        working-directory: paint\build
        shell: cmd
        run: msbuild ArmorPaint.sln /p:Configuration=Release /p:Platform=x64 /m

      - name: Prepare standalone package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_pkg"
          # کپی کردن فایل اجرایی ساخته شده
          $exeFile = Get-ChildItem -Path "paint\build" -Filter "ArmorPaint.exe" -Recurse | Select-Object -First 1
          if (-not $exeFile) {
            Write-Error "ArmorPaint.exe not found!"
            exit 1
          }
          Copy-Item -Path $exeFile.FullName -Destination "release_pkg\"
          # کپی کردن پوشه data و محتویات out در کنار exe
          if (Test-Path "paint\build\out") {
            Copy-Item -Path "paint\build\out\*" -Destination "release_pkg\" -Recurse -Force
          }

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: release_pkg/
          if-no-files-found: error
