
name: Build ArmorPaint Windows Latest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout ArmorPaint
        uses: actions/checkout@v4
        with:
          repository: armory3d/armorpaint
          ref: main
          fetch-depth: 1

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install LLVM
        shell: pwsh
        run: |
          winget install --id LLVM.LLVM --exact `
            --silent --accept-package-agreements `
            --accept-source-agreements

          Add-Content $env:GITHUB_PATH `
            "C:\Program Files\LLVM\bin"

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          winget install --id KhronosGroup.VulkanSDK --exact `
            --silent --accept-package-agreements `
            --accept-source-agreements

          $sdk = Get-ChildItem "C:\VulkanSDK" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $sdk) {
            throw "Vulkan SDK not found"
          }

          $include = Join-Path $sdk.FullName "Include"
          $header = Join-Path $include "vulkan\vulkan_core.h"

          if (-not (Test-Path $header)) {
            throw "Missing Vulkan header: $header"
          }

          "VULKAN_SDK=$($sdk.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          "VK_SDK_PATH=$($sdk.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          "INCLUDE=$include;$env:INCLUDE" |
            Out-File $env:GITHUB_ENV -Append

          Add-Content $env:GITHUB_PATH `
            "$($sdk.FullName)\Bin"

          Write-Host "Vulkan SDK: $($sdk.FullName)"
          Write-Host "Vulkan headers verified."

      - name: Generate Visual Studio project
        shell: pwsh
        working-directory: paint
        run: |
          ..\base\make

      - name: Compile ArmorPaint
        shell: pwsh
        working-directory: paint\build
        run: |
          msbuild ArmorPaint.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /v:minimal

      - name: Find executable and package
        shell: pwsh
        run: |
          $exe = Get-ChildItem paint -Filter ArmorPaint.exe -Recurse |
            Where-Object { $_.FullName -match '\\Release\\' } |
            Select-Object -First 1

          if (-not $exe) {
            $exe = Get-ChildItem paint -Filter ArmorPaint.exe -Recurse |
              Select-Object -First 1
          }

          if (-not $exe) {
            throw "ArmorPaint.exe not found"
          }

          $data = Join-Path $exe.Directory.FullName "data"

          if (-not (Test-Path $data)) {
            throw "Data folder not found"
          }

          New-Item -ItemType Directory -Force package | Out-Null

          Copy-Item $exe.FullName package\ArmorPaint.exe
          Copy-Item $data package\data -Recurse

          Compress-Archive package\* `
            ArmorPaint-Windows-x64.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmorPaint-Windows-x64
          path: ArmorPaint-Windows-x64.zip
          retention-days: 30
