name: Build ArmorPaint

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Generate project files
        working-directory: paint
        run: ..\base\make

      - name: Build solution
        working-directory: paint
        run: msbuild build\ArmorPaint.sln -p:Configuration=Release -p:Platform=x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: armorpaint-windows-x64
          path: |
            paint/build/x64/Release/
            paint/build/krom/
